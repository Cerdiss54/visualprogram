name: Lab4 TypeScript Pipeline Tests

on:
  push:
    branches: [ lab4 ]
  pull_request:
    branches: [ lab4 ]

jobs:
  test-typescript-pipeline:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    
    - name: Install dependencies
      run: |
        cd tc
        npm ci
      working-directory: ./tc
    
    - name: Type check
      run: |
        cd tc
        npx tsc --noEmit
      working-directory: ./tc
    
    - name: Run pipeline tests
      run: |
        cd tc
        npm test
      working-directory: ./tc
    
    - name: Test type safety
      run: |
        cd tc
        npx tsd
      working-directory: ./tc