name: Lab5 TypeScript Pipeline Tests

on:
  push:
    branches: [ itogpr ]
  pull_request:
    branches: [ itogpr ]

jobs:
  test-typescript-pipeline:
    runs-on: ubuntu-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Type check (strict order validation)
      run: npx tsc --noEmit
    
    - name: Run ESLint & Prettier
      run: npx eslint "src/**/*.{ts,tsx}" && npx prettier --check "src/**/*.{ts,tsx}"

    - name: Run type system tests
      run: npm test -- --testNamePattern="type.*order"
    
    - name: Run all tests
      run: npm test