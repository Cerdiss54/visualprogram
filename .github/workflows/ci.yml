name: Lab4 TypeScript Pipeline Tests

on:
  push:
    branches: [ lab4 ]
  pull_request:
    branches: [ lab4 ]

jobs:
  test-typescript-pipeline:
    runs-on: ubuntu-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
    
    - name: Install dependencies
      run: npm ci  # Без cd tc
    
    - name: Type check
      run: npx tsc --noEmit  # Без cd tc
    
    - name: Run tests
      run: npm test  # Без cd tc